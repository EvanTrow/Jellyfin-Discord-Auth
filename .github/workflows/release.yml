name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read version
        id: meta
        run: echo "version=$(jq -r '.version' JellyfinDiscordAuth/meta.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update timestamp in meta.json
        if: steps.check.outputs.skip == 'false'
        run: |
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.timestamp = $ts' JellyfinDiscordAuth/meta.json > tmp.json && mv tmp.json JellyfinDiscordAuth/meta.json

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: dotnet build JellyfinDiscordAuth/JellyfinDiscordAuth.csproj -c Release

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p JellyfinDiscordAuth/artifacts
          zip -j JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip \
            JellyfinDiscordAuth/bin/Release/net9.0/JellyfinDiscordAuth.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.Core.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.Rest.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.WebSocket.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.Commands.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.Interactions.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/Discord.Net.Webhook.dll \
            JellyfinDiscordAuth/bin/Release/net9.0/meta.json

      - name: Compute MD5 checksum
        if: steps.check.outputs.skip == 'false'
        id: checksum
        run: |
          echo "md5=$(md5sum JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip | awk '{print $1}' | tr 'a-f' 'A-F')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --notes "$(jq -r '.changelog' JellyfinDiscordAuth/meta.json)" \
            JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip

      - name: Update manifest.json
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.md5 }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/JellyfinDiscordAuth.zip"
          CHANGELOG=$(jq -r '.changelog' JellyfinDiscordAuth/meta.json)

          NEW_VER=$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg version "$VERSION" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            --arg sourceUrl "$SOURCE_URL" \
            '{changelog: $changelog, checksum: $checksum, sourceUrl: $sourceUrl, targetAbi: "10.11.0.0", timestamp: $timestamp, version: $version}')

          EXISTING=$(jq --arg v "$VERSION" '[.[0].versions[] | select(.version != $v)]' manifest.json)
          ALL_VERSIONS=$(jq -n --argjson new "$NEW_VER" --argjson existing "$EXISTING" '[$new] + $existing')

          jq --argjson versions "$ALL_VERSIONS" '.[0].versions = $versions' manifest.json > tmp.json && mv tmp.json manifest.json

      - name: Push manifest branch
        if: steps.check.outputs.skip == 'false'
        id: push_branch
        run: |
          BRANCH="ci/manifest-v${{ steps.meta.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update manifest for v${{ steps.meta.outputs.version }}"
          git push origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create and auto-merge manifest PR
        if: steps.check.outputs.skip == 'false' && steps.push_branch.outputs.pushed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ci/manifest-v${{ steps.meta.outputs.version }}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update manifest for v${{ steps.meta.outputs.version }}" \
            --body "Automated manifest update for release v${{ steps.meta.outputs.version }}."
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      # Rollback steps — run in reverse dependency order so partial failures are fully cleaned up

      - name: Rollback - delete manifest branch
        if: failure() && steps.push_branch.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin --delete "ci/manifest-v${{ steps.meta.outputs.version }}" || true

      - name: Rollback - delete GitHub release and tag
        if: failure() && steps.create_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.meta.outputs.version }}" --yes --cleanup-tag